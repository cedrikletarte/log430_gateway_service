spring.application.name=Gateway_Service
server.port=8080

# Spring Cloud Gateway routes (local)

# Auth service route
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=0

# Wallet service route
spring.cloud.gateway.server.webflux.routes[2].id=wallet-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://wallet-service:8080
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/wallet/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=0

# Market WebSocket route
spring.cloud.gateway.server.webflux.routes[1].id=market-service-ws
spring.cloud.gateway.server.webflux.routes[1].uri=ws://market-service:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/ws/market/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=0

# Market REST route
spring.cloud.gateway.server.webflux.routes[3].id=market-service-rest
spring.cloud.gateway.server.webflux.routes[3].uri=http://market-service:8080
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/market/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=0

# Order REST route
spring.cloud.gateway.server.webflux.routes[4].id=order-service-rest
spring.cloud.gateway.server.webflux.routes[4].uri=http://order-service:8080
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/order/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=0

# Order WebSocket route
spring.cloud.gateway.server.webflux.routes[5].id=order-service-ws
spring.cloud.gateway.server.webflux.routes[5].uri=ws://order-service:8080
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/ws/orders/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=0


# CORS (relaxed for local dev)
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedOrigins=http://10.194.32.171:5173,http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowCredentials=true

jwt.secret=${JWT_SECRET}
gateway.secret=${GATEWAY_SECRET}

# ========================================
# Actuator & Observability Configuration
# ========================================

# Expose all actuator endpoints
management.endpoints.web.exposure.include=*

# Dedicated port for metrics (optional, otherwise uses the same port)
management.server.port=8080

# Enable detailed metrics
management.metrics.enable.all=true
management.prometheus.metrics.export.enabled=true

# Enable histograms for percentiles (p95, p99)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s

# Detailed health check
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Custom tags to identify the service in Prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=local
