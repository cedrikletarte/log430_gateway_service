services:

  # ============================================
  # 🌐 API GATEWAY (Traefik + Gateway Service)
  # ============================================

  traefik:
    image: traefik:3
    container_name: traefik
    command:
      - "--api.dashboard=true"        # Enable Traefik dashboard
      - "--api.insecure=true"          # Dashboard enabled without authentication
      - "--providers.docker=true"      # Auto-config from Docker labels
      - "--entrypoints.web.address=:80" # Traefik listens on port 80
    ports:
      - "80:80"   # access the API via http://localhost
      - "8080:8080" # Traefik dashboard http://localhost:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    networks:
      - brokerx-network

  gateway-service:
    build: .
    container_name: gateway-service
    expose:
      - "8080"
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/`)" # all requests go to the Gateway
      - "traefik.http.routers.gateway.entrypoints=web" # use the web entrypoint (port 80)
      - "traefik.http.services.gateway.loadbalancer.server.port=8080" # internal service port
      - "traefik.http.services.gateway.loadbalancer.server.scheme=http" # http scheme
    restart: always
    networks:
      - brokerx-network

# ============================================
# 🌐 NETWORKS
# ============================================

networks:
  brokerx-network:
    external: true
    name: brokerx-network
